<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="instamsdhoni-fc logo">
  <defs>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FA8"/>
      <stop offset="100%" stop-color="#4FA8E0"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="url(#ballGrad)" stroke-width="4"/>

  <!-- cricket ball -->
  <circle cx="60" cy="60" r="34" fill="url(#ballGrad)"/>
  <path d="M 34 60 A 26 26 0 0 1 86 60" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,3"/>
  <path d="M 34 60 A 26 26 0 0 0 86 60" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,3"/>

  <!-- bat crossing behind ball -->
  <g transform="rotate(-28 60 60)">
    <rect x="56" y="10" width="8" height="46" rx="3" fill="#F2F7FB" stroke="#1E6FA8" stroke-width="1.5"/>
    <rect x="54" y="52" width="12" height="26" rx="4" fill="#EAF3FA" stroke="#1E6FA8" stroke-width="1.5"/>
  </g>

  <!-- number 7 (Dhoni's jersey number) on ball -->
  <text x="60" y="70" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">7</text>
</svg>
